<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Customer Login / Register</title>

    <!-- Bootstrap 5 CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: #f5f7fa;
      }
      .auth-box {
        max-width: 500px;
        margin: 60px auto;
        padding: 30px;
        background: white;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      .nav-tabs .nav-link.active {
        background: #0d6efd;
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="auth-box">
      <!-- Tabs -->
      <ul class="nav nav-tabs mb-3" id="authTab">
        <li class="nav-item">
          <button
            class="nav-link active"
            data-bs-toggle="tab"
            data-bs-target="#loginTab"
          >
            Login
          </button>
        </li>
        <li class="nav-item">
          <button
            class="nav-link"
            data-bs-toggle="tab"
            data-bs-target="#registerTab"
          >
            Register
          </button>
        </li>
      </ul>
      <!-- Tab Contents -->
      <div class="tab-content">
        <!-- LOGIN -->
        <div class="tab-pane fade show active" id="loginTab">
          <h4 class="mb-3">Login to Your Account</h4>
          <!-- LOGIN FORM -->
          <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="mb-3">
              <label>Email / Phone</label>
              <input
                type="text"
                class="form-control"
                name="login_id"
                required
              />
            </div>

            <div class="mb-3">
              <label>Password</label>
              <input
                type="password"
                class="form-control"
                name="password"
                required
              />
            </div>

            <!-- LOGIN AS -->
            <div class="mb-3">
              <label>Login as</label>
              <select name="user_type" class="form-control" required>
                <option value="customer">Customer</option>
                <option value="employee">Employee</option>
              </select>
            </div>


            <button type="submit" class="btn btn-primary w-100">Login</button>
            {% if messages %}
            <div class="container mt-3">
              {% for message in messages %}
              <div
                class="alert alert-{{ message.tags }} alert-dismissible fade show"
                role="alert"
              >
                {{ message }}
                <button
                  type="button"
                  class="btn-close"
                  data-bs-dismiss="alert"
                  aria-label="Close"
                ></button>
              </div>
              {% endfor %}
            </div>
            {% endif %}
          </form>
        </div>

        <!-- REGISTER -->
        <div class="tab-pane fade" id="registerTab">
          <h4 class="mb-3">Create New Account</h4>

          <form method="POST" action="{% url 'register' %}">
            {% csrf_token %}

            <div class="mb-3">
              <label>Full Name</label>
              <input
                type="text"
                class="form-control"
                name="full_name"
                required
              />
            </div>

            <div class="mb-3">
              <label>Email (optional)</label>
              <input type="email" class="form-control" name="email" />
            </div>

            <div class="mb-3">
              <label>Phone Number</label>
              <input type="text" class="form-control" name="phone" required />
            </div>

            <div class="mb-3">
              <label>Password</label>
              <input
                type="password"
                class="form-control"
                name="password"
                required
              />
            </div>

            <!-- REGISTER AS -->
            <div class="mb-3">
              <label>Register as</label>
              <select name="user_type" class="form-control" required>
                <option value="customer">Customer</option>
                <option value="employee">Employee</option>
              </select>
            </div>

            <button type="submit" class="btn btn-success w-100">
              Register
            </button>

            <!-- REGISTER MESSAGES -->
            {% if messages %}
            <div class="container mt-3">
              {% for message in messages %}
              <div
                class="alert alert-{{ message.tags }} alert-dismissible fade show"
                role="alert"
              >
                {{ message }}
                <button
                  type="button"
                  class="btn-close"
                  data-bs-dismiss="alert"
                  aria-label="Close"
                ></button>
              </div>
              {% endfor %}
            </div>
            {% endif %}
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
