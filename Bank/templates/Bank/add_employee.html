<!DOCTYPE html>
<html>
<head>
    <title>Add Employee</title>
    <style>
        body { font-family: Arial; background: #eef2f7; padding: 40px; }
        .container { width: 40%; margin: auto; background: white; padding: 25px; border-radius: 8px; }
        label { display: block; margin-top: 10px; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; }
        button { margin-top: 15px; padding: 10px 20px; background: #0077cc; color: white; border: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Add Employee</h2>

    <form method="POST">
        {% csrf_token %}

        <label>Employee ID</label>
        <input type="text" name="Employee_ID" required>

        <label>Branch ID</label>
        <select name="Branch_ID">
            {% for b in branches %}
                <option value="{{ b.0 }}">{{ b.0 }} - {{ b.1 }}</option>
            {% endfor %}
        </select>

        <label>Name</label>
        <input type="text" name="Ename">

        <label>Address</label>
        <input type="text" name="Eaddress">

        <label>Phone</label>
        <input type="number" name="Ephonenumber">

        <label>Role</label>
        <input type="text" name="Eroll">

        <label>Salary</label>
        <input type="number" step="0.01" name="salary">

        <label>Hire Date</label>
        <input type="date" name="Hiredate" required>

        <label>Left Date</label>
        <input type="date" name="Leftdate">

        <button type="submit">Add Employee</button>
    </form>
</div>

</body>
</html>
