<!DOCTYPE html>
<html>
<head>
    <title>Add Borrower</title>
    <style>
        body { font-family: Arial; background: #f3f3f3; padding: 40px; }
        .container { width: 50%; margin: auto; background: #fff; padding: 25px; border-radius: 10px; }
        label { display: block; margin-top: 10px; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; }
        button { margin-top: 15px; padding: 10px; background: purple; color: white; border: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Add Borrower</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <label>Borrower ID</label>
        <input type="text" name="BorrowerID" required>

        <label>Full Name</label>
        <input type="text" name="Full_name" required>

        <label>Father Name</label>
        <input type="text" name="Father_name" required>

        <label>Mother Name</label>
        <input type="text" name="Mother_name" required>

        <label>Grandfather Name</label>
        <input type="text" name="GrandFather_name" required>

        <label>Address</label>
        <input type="text" name="Address" required>

        <label>Date of Birth</label>
        <input type="date" name="Date_of_Birth">

        <label>Gender</label>
        <select name="Gender">
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>

        <label>Phone Number</label>
        <input type="number" name="Phone_number" required>

        <label>Email</label>
        <input type="email" name="Email">

        <label>Nationality</label>
        <input type="text" name="Nationality">

        <label>Citizenship Number</label>
        <input type="number" name="Citizenship_number">

        <label>National Identity Number</label>
        <input type="number" name="NationalIdentityNumber">


        <label>Loan Amount</label>
        <input type="number" step="0.01" name="LoanAmount" required>

        <label>Interest Rate</label>
        <input type="number" step="0.01" name="InterestRate" required>

        <label>Loan Type</label>
        <input type="text" name="LoanType">

        <label>Start Date</label>
        <input type="date" name="StartDate" required>

        <label>End Date</label>
        <input type="date" name="EndDate">

        <label> upload Photo</label>
        <input type="file" name="image_path">

        <button type="submit">Add Borrower</button>
    </form>
</div>

</body>
</html>
