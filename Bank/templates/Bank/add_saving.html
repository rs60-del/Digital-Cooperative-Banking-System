<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Add Saving Record</title>
    <style>
        body { font-family: Arial, sans-serif; background:#f3f6fa; margin:40px; }
        .card { max-width:700px; margin:auto; background:white; padding:24px; border-radius:10px; box-shadow:0 6px 18px rgba(0,0,0,0.08);}
        h2 { text-align:center; color:#222; margin-bottom:20px; }
        label { display:block; margin-top:12px; font-weight:600; color:#333; }
        input[type="text"], input[type="number"], input[type="date"], select {
            width:100%; padding:10px; margin-top:6px;
            border:1px solid #ccc; border-radius:6px;
            font-size: 14px;
        }
        button {
            margin-top:20px; width:100%; padding:12px;
            background:#1976D2; color:white;
            border:none; border-radius:6px;
            font-size:16px; font-weight:600; cursor:pointer;
        }
        button:hover { background:#145ea8; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Add Savings Deposit</h2>

        <form method="POST">
            {% csrf_token %}

            <label>Account Number</label>
            {% if accounts %}
            <select name="Account_Number" required>
                <option value="">-- Select Account Number --</option>
                {% for acc in accounts %}
                    <option value="{{ acc.0 }}">{{ acc.0 }}</option>
                {% endfor %}
            </select>
            {% else %}
            <input type="text" name="Account_Number" placeholder="Enter Account Number" required>
            {% endif %}

            <label>Customer</label>
            {% if customers %}
            <select name="Customer_ID" required>
                <option value="">-- Select Customer --</option>
                {% for c in customers %}
                    <option value="{{ c.0 }}">{{ c.1 }} ({{ c.0 }})</option>
                {% endfor %}
            </select>
            {% else %}
            <input type="text" name="Customer_ID" placeholder="Enter Customer ID" required>
            {% endif %}

            <label>Saving Amount</label>
            <input type="number" step="0.01" name="Amount" placeholder="Enter deposit amount" required>

            <label>Saving Date</label>
            <input type="date" name="Saving_Date" value="{{ today|default:'' }}">

            <label>Saving Type</label>
            <select name="Saving_Type" required>
                <option value="">-- Select Saving Type --</option>
                <option value="Daily">Daily</option>
                <option value="Weekly">Weekly</option>
                <option value="Monthly">Monthly</option>
            </select>

            <button type="submit">Add Saving Record</button>
        </form>

    </div>

</body>
</html>
