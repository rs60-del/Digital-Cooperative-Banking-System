<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>

        <td>{{ c.2 }}</td>
        <td>{{ c.3 }}</td>
        <td>{{ c.4 }}</td>
        <td>{{ c.5 }}</td>
        <td>{{ c.6 }}</td>
        <td>{{ c.7 }}</td>
        <td>{{ c.8 }}</td>
        <td>{{ c.9 }}</td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
