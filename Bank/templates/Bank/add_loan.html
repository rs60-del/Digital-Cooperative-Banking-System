<!DOCTYPE html>
<html>
  <head>
    <title>Add Loan</title>
    <style>
      body {
        font-family: Arial;
        background: #eef2f7;
        padding: 40px;
      }
      .container {
        width: 40%;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 8px;
      }
      label {
        display: block;
        margin-top: 10px;
      }
      input,
      select {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
      }
      button {
        margin-top: 15px;
        padding: 10px 20px;
        background: #0077cc;
        color: white;
        border: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Add Loan</h2>

      <form method="POST">
        {% csrf_token %}

        <label>Loan ID</label>
        <input type="text" name="LoanID" required />

       <label>Account Number</label>
        <select name="Account_Number">
          {% for acc in accounts %}
          <option value="{{ acc.0 }}">{{ acc.0 }}</option>
          {% endfor %}
        </select>

        <label>Loan Taken By:</label>
        <select name="loan_taken_by" required>
          <option value="customer">Customer</option>
          <option value="borrower">Borrower-External</option>
        </select>

        <!-- For Customer Loan -->
        <label>Customer</label>
        <select name="CustomerID">
          {% for c in customers %}
          <option value="{{ c.0 }}">{{ c.0 }}</option>
          {% endfor %}
        </select>


        <!-- For External Borrower -->
        <label>Borrower</label>
        <select name="BorrowerID">
          {% for b in borrowers %}
          <option value="{{ b.0 }}">{{ b.0 }}</option>
          {% endfor %}
        </select>

        <label>Loan Amount</label>
        <input type="number" step="0.01" name="LoanAmount" />

        <label>Interest Rate</label>
        <input type="number" step="0.01" name="InterestRate" />

        <label>Loan Type</label>
        <input type="text" name="LoanType" />

        <label>Start Date</label>
        <input type="date" name="StartDate" />

        <label>End Date</label>
        <input type="date" name="EndDate" />

        <button type="submit">Add Loan</button>
      </form>
    </div>
  </body>
</html>
