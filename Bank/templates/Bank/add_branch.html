<!DOCTYPE html>
<html>
<head>
    <title>Add Branch</title>
    <style>
        body { font-family: Arial; background: #eef2f7; padding: 40px; }
        .container { width: 40%; margin: auto; background: white; padding: 25px; border-radius: 8px; }
        label { display: block; margin-top: 10px; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; }
        button { margin-top: 15px; padding: 10px 20px; background: #0077cc; color: white; border: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Add Branch</h2>

    <form method="POST">
        {% csrf_token %}

        <label>Branch ID</label>
        <input type="text" name="Branch_ID" required>

        <label>Branch Name</label>
        <input type="text" name="Branch_name">

        <label>Branch Address</label>
        <input type="text" name="Branch_address">

        <label>Branch Phone</label>
        <input type="number" name="Branch_phonenum">

        <label>Account Number (FK)</label>
        <select name="Account_number">
            {% for acc in accounts %}
                <option value="{{ acc.0 }}">{{ acc.0 }}</option>
            {% endfor %}
        </select>

        <button type="submit">Add Branch</button>
    </form>
</div>

</body>
</html>
